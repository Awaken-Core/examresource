<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <path id="topArc" d="M 17,50 A 33,33 0 1,1 83,50" fill="none" />
    <path id="bottomArc" d="M 83,50 A 33,33 0 0,1 17,50" fill="none" />
  </defs>
  <!-- Background circular base -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" />
  <!-- Rings -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#64748B" stroke-width="1.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#94A3B8" stroke-width="0.75" />
  <circle cx="50" cy="50" r="29" fill="none" stroke="#64748B" stroke-width="0.75" />
  
  <!-- Outer circular text -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="600" fill="#475569" letter-spacing="0.4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      GOVERNMENT OF INDIA
    </textPath>
  </text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="600" fill="#64748B" letter-spacing="0.4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      MINISTRY OF RAILWAYS
    </textPath>
  </text>
  
  <!-- Ashoka Pillar Lions Emblem in center -->
  <g transform="translate(35, 32) scale(0.3)" fill="#334155" stroke="#334155" stroke-width="0.5">
    <!-- Center Lion Face & Mane -->
    <path d="M50 0 C42 0 38 8 38 18 C33 18 28 23 28 32 C28 40 33 46 38 50 L38 58 C32 60 22 64 16 72 L84 72 C78 64 68 60 62 58 L62 50 C67 46 72 40 72 32 C72 23 67 18 62 18 C62 8 58 0 50 0 Z" fill="#475569" opacity="0.85" />
    <!-- Facial / Mane etchings -->
    <path d="M44 20 L50 25 L56 20 M50 25 L50 36 M42 38 L58 38" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <!-- Left Lion silhouette -->
    <path d="M30 22 C22 22 18 28 18 36 C18 42 22 47 28 49 Z" fill="#64748B" opacity="0.7" />
    <!-- Right Lion silhouette -->
    <path d="M70 22 C78 22 82 28 82 36 C82 42 78 47 72 49 Z" fill="#64748B" opacity="0.7" />
    <!-- Ashoka Chakra Base -->
    <rect x="20" y="74" width="60" height="3" rx="1.5" fill="#334155" />
    <circle cx="50" cy="83" r="5.5" fill="none" stroke="#334155" stroke-width="1.2" />
    <circle cx="50" cy="83" r="1.5" fill="#334155" />
    <!-- Bull on left, Horse on right -->
    <path d="M26 84 C24 81 29 80 32 84 Z" fill="#64748B" />
    <path d="M74 84 C76 81 71 80 68 84 Z" fill="#64748B" />
    <!-- Base plinth -->
    <rect x="14" y="90" width="72" height="3.5" rx="1" fill="#475569" />
  </g>
</svg>